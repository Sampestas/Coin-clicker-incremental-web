name: CI/CD Coin Clicker Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
    - name: Copy repository code
      uses: actions/checkout@v4

    - name: Set up Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install ESLint
      run: npm install eslint @eslint/js globals --save-dev

    - name: Run ESLint Check
      run: npx eslint scripts/
