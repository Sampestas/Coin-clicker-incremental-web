<!DOCTYPE html>
<html>
    <head>
        <title>Coin Clicker Incremental</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <link rel="icon" href="data:,">

        <link rel="stylesheet" href="css/main.css">
    </head>
    <body>

        <div id="gameName">Coin Clicker Incremental</div>

        <div class="game-container">   
            <div class="game-layout">
                <div class="clicker-section">
                    <div class="coins-container">
                        <div class="coins-display" id="coinDisplay">Coins: 0</div>
                        <div class="diamonds-display" id="diamondsDisplay">Diamonds: 0</div>
                        <div class="stat-container">
                            <div class="stat-display" id="cpsDisplay">Coins per second: </div>
                            <div class="stat-display" id="cpcDisplay">Coins per click: </div>
                        </div>
                    </div>
                    
                    <button id="clickButton" class="game-btn btn-gold">
                        <img src="assets/images/coin.png" class="btn-content coin-img" alt="Mine coins">
                    </button>

                    <button class="prestige-button" id="prestige-btn">
                        <strong>PRESTIGE</strong><br>
                        <span class="prestige-text">You will get: <span class="prestige-diamond-amount" id="dmnd-amount-prestige">0</span> 💎 (10k coins = 1 💎)</span>
                    </button>
                </div>

                <div id="upgradeContainer" class="upgrade-container"></div>
            </div>
        </div>

        

        <div id="offlineModal" class="modal-overlay">
            <div class="modal-content">
                <h2>Welcome back!</h2>
                <p>You were away for <span id="offlineTime">0</span> seconds.</p>
                <p>Your gnomes mined <span id="offlineCoins" style="color: #ffd700;">0</span> coins!</p>
                <button id="closeModalBtn" class="modal-close-btn">Close</button>
            </div>
        </div>

        <template id="upgradeTemplate">
            <div class="upgrade-item">
                <div class="upgrade-info">
                    <span class="upgrade-name">
                        <span class="js-name">Loading</span>
                        (<span class="js-count">0</span>)
                    </span>
                    <span class="upgrade-description"></span>
                    <span class="upgrade-cost">Cost:
                        <span class="js-cost">0</span>
                    </span>
                </div>
                <button class="upgrade-button js-button">Buy</button>
            </div>
        </template>


        <script type="module" src="scripts/main.js"></script>
    </body>
</html>
